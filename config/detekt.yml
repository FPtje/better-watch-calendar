# Overrides on top of detekt's default config (buildUponDefaultConfig).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Files are named after their main function, often alongside its small error/result type.
    active: false

style:
  MagicNumber:
    # @ProtoNumber field numbers are the schema itself.
    ignoreAnnotation: true
